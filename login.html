<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود مدیر | کتابخانه</title><link rel="stylesheet" href="style.css?v=10"><style>.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-box{width:min(430px,100%);background:#faf9f6;border:1px solid #ddd9d2;border-radius:22px;padding:30px}.login-box label{display:block;font-weight:bold;margin:15px 0 6px}.login-box input{width:100%;padding:12px;border:1px solid #d8d4ce;border-radius:10px}.login-box button{width:100%;margin-top:18px;border:0;background:#222;color:#fff;border-radius:10px;padding:13px;font-weight:bold}.login-msg{margin-top:12px;color:#a00000}</style></head><body><div class="login"><div class="login-box"><h1> ورود مدیر</h1><p>اطلاعات حساب مدیر را وارد کنید.</p><form id="loginForm"><label>ایمیل</label><input id="email" type="email" required><label>رمز عبور</label><input id="password" type="password" required><button id="loginBtn">ورود به پنل</button><div id="loginMsg" class="login-msg"></div></form><p><a href="index.html">← بازگشت</a></p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient("https://pophcxrfrooqluwrujbl.supabase.co","sb_publishable_cmZlKwLESb-jIWkkQAC7yg_KxNdkJfn");document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("loginBtn"),m=document.getElementById("loginMsg");b.disabled=true;b.textContent="در حال ورود...";const{error}=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){m.textContent="ورود ناموفق: "+error.message;b.disabled=false;b.textContent="ورود به پنل";return}location.href="admin.html"})</script></body></html>
