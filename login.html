<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورود مدیر | کتابخانه</title>
<link rel="stylesheet" href="style.css">
<style>
body{min-height:100vh;display:grid;place-items:center;background:#f7f7ff}
.login-box{width:min(92%,430px);background:#fff;padding:32px;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.login-box h1{margin:0 0 8px}.login-box p{color:#777}
.login-box label{display:block;margin:18px 0 7px;font-weight:700}
.login-box input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}
.login-btn{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:#5b4bdb;color:#fff;font-size:16px;font-weight:700}
.msg{margin-top:15px;padding:12px;border-radius:10px;display:none}.error{background:#ffe8e8;color:#a40000}
.back{display:inline-block;margin-top:18px;text-decoration:none}
</style>
</head>
<body>
<main class="login-box">
<div style="font-size:48px">📚</div>
<h1>ورود مدیر</h1>
<p>برای مدیریت کتاب‌های کتابخانه وارد شوید.</p>
<form id="loginForm">
<label for="email">ایمیل</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">رمز عبور</label>
<input id="password" type="password" autocomplete="current-password" required>
<button class="login-btn" type="submit">ورود به پنل</button>
</form>
<div id="msg" class="msg"></div>
<a class="back" href="index.html">← بازگشت به کتابخانه</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
</body>
</html>
