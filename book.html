<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کتاب | کتابخانه</title>
<link rel="stylesheet" href="style.css?v=6">
<style>
.book-page{max-width:1150px;margin:35px auto;padding:0 18px}
.back{display:inline-flex;padding:9px 14px;border-radius:12px;background:#fff;border:1px solid #e3e3df;margin-bottom:18px;font-size:12px}
.book-detail{display:grid;grid-template-columns:310px 1fr;gap:40px;background:#fff;border:1px solid #e3e3df;border-radius:20px;padding:35px;box-shadow:0 10px 30px #0000000a}
.book-cover-large{width:100%;max-width:310px;aspect-ratio:2/3;object-fit:cover;border-radius:14px;display:block;margin:auto;box-shadow:0 20px 45px #00000025}
.book-info h1{font-size:38px;line-height:1.5;margin:8px 0}
.book-author{color:#777;font-size:15px}
.book-category{display:inline-block;background:#eeeeeb;color:#333;padding:5px 12px;border-radius:20px;font-size:11px;margin-bottom:10px}
.book-meta{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
.book-meta span{background:#f1f1ef;padding:7px 12px;border-radius:10px;font-size:11px}
.book-description{line-height:2.2;font-size:14px;color:#555;margin:25px 0}
.read-button{display:inline-flex;align-items:center;justify-content:center;background:#222;color:#fff;padding:13px 25px;border-radius:12px;font-size:13px;font-weight:bold;transition:.2s}
.read-button:hover{transform:translateY(-2px);background:#000}
.no-pdf{display:inline-block;background:#eee;color:#777;padding:12px 20px;border-radius:12px;font-size:12px}
body.dark .back,body.dark .book-detail{background:#222;color:#eee;border-color:#383838}
body.dark .book-category,body.dark .book-meta span{background:#333;color:#eee}
body.dark .book-description,body.dark .book-author{color:#aaa}
body.dark .read-button{background:#fff;color:#111}
@media(max-width:700px){
.book-page{margin:20px auto;padding:0 10px}
.book-detail{grid-template-columns:1fr;gap:25px;padding:20px}
.book-cover-large{max-width:230px}
.book-info h1{font-size:28px}
.read-button{width:100%}
}
</style>
</head>
<body>
<header class="topbar">
<a class="logo" href="index.html"><b>▣ کتابخانه</b><small>دنیای کتاب، دنیای بهتر</small></a>
<nav>
<a href="index.html">خانه</a>
<a href="index.html#books">کتاب‌ها</a>
<a href="index.html#categories">دسته‌بندی‌ها</a>
</nav>
<div class="actions">
<button id="darkMode">☾</button>
<a href="login.html">ورود مدیر</a>
</div>
</header>

<main class="book-page">
<a class="back" href="index.html">← بازگشت به کتابخانه</a>
<div id="content" style="text-align:center;padding:70px 10px">در حال بارگذاری کتاب...</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="book.js?v=1"></script>
</body>
</html>
