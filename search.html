<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>جستجوی کتاب | کتابخانه</title>
<link rel="stylesheet" href="style.css?v=200">
<style>
.search-page{width:min(1200px,94%);margin:35px auto}
.search-top{background:#faf9f6;border:1px solid #ddd9d2;border-radius:20px;padding:25px;margin-bottom:20px}
.search-large{display:flex;gap:10px;background:#fff;border:1px solid #d8d4ce;border-radius:14px;padding:5px 15px}
.search-large input{width:100%;border:0;outline:0;padding:12px;background:transparent}
.search-large button{border:0;background:#222;color:#fff;border-radius:10px;padding:10px 18px;cursor:pointer}
.result-title{display:flex;justify-content:space-between;align-items:center;gap:10px}
.result-title small{color:#777}
.empty{text-align:center;padding:60px 15px;color:#777}
</style>
</head>
<body>
<header class="topbar">
<a class="logo" href="index.html"><b>▣ کتابخانه</b><small>دنیای کتاب، دنیای بهتر</small></a>
<nav><a href="index.html">خانه</a><a href="index.html#books">کتاب‌ها</a><a href="index.html#popular">محبوب‌ترین‌ها</a></nav>
<div class="actions"><button id="darkMode" type="button"></button></div>
</header>

<main class="search-page">
<section class="search-top">
<a class="back-link" href="index.html">← بازگشت به کتابخانه</a>
<h1>جستجوی کتاب</h1>
<form id="searchForm" class="search-large">
<input id="query" type="search" placeholder="عنوان، نویسنده یا دسته‌بندی..." autocomplete="off">
<button type="submit">جستجو</button>
</form>
</section>

<section class="panel">
<div class="result-title"><h2>نتایج جستجو</h2><small id="resultCount">در حال جستجو...</small></div>
<div id="results" class="grid"><div class="loading">در حال بارگذاری...</div></div>
</section>
</main>

<div id="fixedAd" class="ad-fixed" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="ads.js?v=301"></script>
<script src="search.js?v=201"></script></body>
</html>
